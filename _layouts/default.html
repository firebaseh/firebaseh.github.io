<!DOCTYPE html>
<html>
{% include head.html %}

<body>
  {% include navigation.html %}

  <div class="container">
    <div class="wrapper">{{ content }}</div>
  </div>

  {% include footer.html %}

  <!-- JS, Popper.js, and jQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
    integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
    integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3" crossorigin="anonymous">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
    integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V" crossorigin="anonymous">
  </script>

  <script>
    /* SEARCH */
    const searchInput = document.getElementById('search-input');
    const posts = document.querySelectorAll('.post-item');

    searchInput.addEventListener('keyup', function () {
      let val = this.value.toLowerCase();
      posts.forEach(post => {
        post.style.display = post.innerText.toLowerCase().includes(val) ? '' : 'none';
      });
    });


    /* CATEGORY FILTER */
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        let filter = btn.dataset.filter;

        posts.forEach(post => {
          let cat = post.dataset.category;

          post.style.display = (filter === 'all' || cat.includes(filter)) ? '' : 'none';
        });
      });
    });


    /* LOAD MORE */
    let page = 2;
    const btn = document.getElementById('load-more');
    const container = document.getElementById('post-container');

    btn.addEventListener('click', () => {
      fetch(`/page${page}/`)
        .then(res => res.text())
        .then(html => {
          let doc = new DOMParser().parseFromString(html, 'text/html');
          let newPosts = doc.querySelectorAll('.post-item');

          if (newPosts.length === 0) {
            btn.style.display = 'none';
            return;
          }

          newPosts.forEach(el => container.appendChild(el));
          page++;
        });
    });
  </script>

  {% if site.analytics %}{% include analytics.html %}{% endif %}
</body>

</html>
