<footer class="footer mt-5 pt-5 pb-4 bg-light border-top shadow-none">
  <div class="container">
    <div class="row g-4">

            <!-- MENU -->
      <div class="col-12 col-md-6 text-center">
        © {{ site.time | date: "%Y" }}
        {% if site.copyright.name %}
        <a href="{{site.copyright.link}}" class='text-decoration-none text-capitalize fw-bolder' target="_blank">
          {{site.copyright.name}}
        </a>
        {% else %}
        {{ site.title }}
        {% endif %}
        . All rights reserved.
      </div>

    </div>


  </div>
</footer>
